<div class="login-container">
  <div class="login-card">
    <h2>NóminaPro 2026</h2>
    <p class="subtitle">Inicie sesión para acceder al sistema corporativo</p>

    @if (error) {
      <div class="alert-error">{{ error }}</div>
    }

    <form (submit)="$event.preventDefault(); onLogin()">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="correo@nominapro.com" required />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-primary">Iniciar Sesión</button>
    </form>

    <div class="access-rapido">
      <p>Acceso rápido de prueba por Rol:</p>
      <div class="btn-roles">
        <button (click)="iniciarComo('Empleado')" class="btn-rol empleado">👤 Empleado</button>
        <button (click)="iniciarComo('Jefatura')" class="btn-rol jefatura">👔 Jefatura</button>
        <button (click)="iniciarComo('RRHH')" class="btn-rol rrhh">🏢 RR.HH.</button>
      </div>
    </div>
  </div>
</div>
